name: Push trigger for tuvali

on:
  push:
    branches:
      - master
      - develop
      - qa-develop
      - 'release-**'
      - sonartest
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master
      - develop
      - qa-develop
      - 'release-**'

jobs:
  build-kotlin:
    uses: mosip/kattu/.github/workflows/gradle-build.yml@gpgupdate-masterj21
    with:
      SERVICE_LOCATION: kotlin/android
      JAVA_VERSION: 17
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_INJI_TEAM }}

  sonar_analysis:
    needs: build-kotlin
    if: "${{  github.event_name != 'pull_request' }}"
    uses: Mahesh-Binayak/kattu/.github/workflows/gradlew-sonar-analysis.yml@sonartest
    with:
      SERVICE_LOCATION: kotlin/android
      SONAR_ARGS: >-
        -Dsonar.language=kotlin
        -Dsonar.java.binaries=build/intermediates/javac/debug
        -Dsonar.exclusions=**/build/**,**/*.kt.generated,**/R.java,**/BuildConfig.java
        -Dsonar.scm.disabled=true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ORG_KEY: ${{ secrets.ORG_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_INJI_TEAM }}

