apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.sonarqube'
apply plugin: 'maven-publish'
apply plugin: 'signing'

buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  ext.kotlin_version = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : project.properties['Tuvali_kotlinVersion']
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:8.1.0'
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    classpath "org.sonarqube:org.sonarqube.gradle.plugin:5.1.0.4872"
  }
}


def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['Tuvali_' + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['Tuvali_' + name]).toInteger()
}

android {
  namespace "io.mosip.tuvali.rnModule"
  compileSdk getExtOrIntegerDefault('compileSdkVersion')

  defaultConfig {
    minSdk getExtOrIntegerDefault('minSdkVersion')
    targetSdk getExtOrIntegerDefault('targetSdkVersion')
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable 'GradleCompatible'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  kotlinOptions {
    jvmTarget = "1.8"
  }

}

repositories {
  mavenCentral()
  google()

}

dependencies {
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.2'

  implementation 'org.bouncycastle:bcpkix-jdk15to18:1.68'
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.68'
  implementation 'com.github.snksoft:crc:1.1.0'
  implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

}

sonarqube {
  properties {
    property "sonar.java.binaries", "build/intermediates/javac/debug"
    property "sonar.language", "kotlin"
    property "sonar.exclusions", "**/build/**, **/*.kt.generated, **/R.java, **/BuildConfig.java"
    property "sonar.scm.disabled", "true"
  }
}

apply from: "publish-artifact.gradle"
